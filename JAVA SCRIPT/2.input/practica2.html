<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: sans-serif;
            }
            section{
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                justify-content: center;
                align-items: center;
                background: linear-gradient(45deg, rgb(253, 253, 253), rgb(255, 255, 255));
            }
            section 
            .container{
                position: relative;
                display: flex;
                flex-direction: column;
                border: 2px solid rgba(255,255,255,0.5);
                background: rgba(33, 32, 32, 0.3);
                border-radius: 10px;
                overflow: hidden;
                padding: 80px 15px 30px;
                transition: 0.3s;
            }
            .container:hover{
                transform: scale(1.03);
            }
            .title{
                width: 100%;
                position: absolute;
                display: flex;
                background: rgb(0, 0, 0);
                padding:1em 3em;
                top: 0;
                left: 0;
                text-align: center;
                text-transform: uppercase;
                font-size: 14px;
                letter-spacing: 1px;
                color: #fff;
                font-weight: 600;
            }
            .inputtext{
                margin: 20px 0;
            }
            input{
                width: 20em;
                height: 2em;
                border-radius: 15px;
                background: rgb(80, 81, 82);
                padding-left: 10px;
                border: 1.5px solid rgba(255,255,255,0.5);
                transition: 0.3s;
                color: #fff;
            }
            input::placeholder{
                color: rgba(255,255,255,0.6);
                font-weight: 500;
            }
            input:focus{
                outline: none;
                color: white;
                border: 1.5px solid rgba(255,255,255,0.5);
                transform: scale(1.05);
            }
            .nye{
                color: #fff;
                font-weight: 600;
                display: block;
            }
            .btn{
                position: relative;
                margin-top: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            button{
                width: 10em;
                height: 50px;
                background-color: rgb(0, 0, 0);
                border: 1px solid rgb(255, 255, 255);
                border-radius: 10px;
                color: #fff;
                font-weight: 600;
                font-size: 15px;
                transition: 0.07s;
            }
            button:active{
                transform: scale(0.9) ;
                background-color: rgb(0, 8, 6);
            }
            
        </style>
</head>
<body>
    <section>
    <div class="container">
        <div class="title">
            <span>Ingresa tu nombre y edad</span>
        </div>
        <span class="nye">Tu nombre</span><hr>
        <div class="inputtext">
            <input type="text" id="nombreUsuario" placeholder="Pon tu nombre" spellcheck="false">
        </div>
        <span class="nye">Tu edad</span><hr>
        <div class="inputtext">
            <input type="number" id="edad" placeholder="Pon tu edad" spellcheck="false">
        </div>
        <div class="btn">
            <button onclick="presentacion()">Presentación</button>
        </div>
    </div>
    </section>
    <script>
        function presentacion() {
            const nombre = document.getElementById("nombreUsuario").value.trim();
            const edad = document.getElementById("edad").value;

            if (nombre === "") {
                alert("Escribe tu nombre.");
            } else {
                const nombreTitulo = nombre.charAt(0).toUpperCase() + nombre.slice(1);

                alert("¡Bienvenido a esta pagina " + nombreTitulo + "!");
                alert("Me llamo " + nombreTitulo + " y tengo " + edad + " años.");
            }
        }
    </script>
</body>
</html>
