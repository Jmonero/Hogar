<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="texto">
        <h2>Keyla deme un chance</h2>
    <div class="botones">
    <div class="btn-saludar">
        <button onclick="saludar ()" class="btn1">
            <span>SI</span>
        </button>
    </div>
    <div class="btn-despedir">
        <button onclick="despedir ()" class="btn2">
            <span>CLaro que si</span>
        </button>
    </div>
    </div>
</div>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            position: relative;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            display: flex;
            background: linear-gradient(45deg,#000000,#3a3a39);
            flex-wrap: wrap;
        }
        .texto{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .texto h2{
            color: rgb(255, 255, 255);
            padding-bottom: 60px;
        }
        .botones{
            display: flex;
            gap: 20px;
        }
        .btn1{
            width: 150px;
            height: 100px;
            background: rgb(253, 253, 253);
            border-right: 2px solid rgba(0,0,0,0.5);
            border-left: 2px solid rgba(255,255,255,0.5);
            border-bottom: 2px solid rgba(0,0,0,0.5);
            border-top: 2px solid rgba(255,255,255,0.5);
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn2{
            width: 150px;
            height: 100px;
            background: rgb(253, 253, 253);
            border-radius: 10px;
            border-right: 2px solid rgba(0,0,0,0.5);
            border-left: 2px solid rgba(255,255,255,0.5);
            border-bottom: 2px solid rgba(0,0,0,0.5);
            border-top: 2px solid rgba(255,255,255,0.5);
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: 0.25s;
        }
        button:active{
            padding-top: 3px;
            padding-left: 5px;
            cursor: pointer;
            border-left: 2px solid rgba(0,0,0,0.5);
            border-right: 2px solid rgba(255,255,255,0.5);
            border-top: 2px solid rgba(0,0,0,0.5);
            border-bottom: 2px solid rgba(255,255,255,0.5);
            box-shadow: 12px 12px 20px rgba(0,0,0,0.5);
        }


        button span{
            color: rgb(3, 0, 0);
            font-size: 25px;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 100px #fff;
}
    </style>
    <script>

        function saludar (){
            console.log ("¡Hola Jair, Que cuentas!");
            console.log ("Estamos en el año escolar 2026-2027")
        }
        function despedir (){
            console.log ("¡Nos vemos, Jair!")
        }
    </script>
    </main>
</body>
</html>
